site_name: Jay Lee
site_description: Senior Full-stack Engineer | Ruby on Rails & React
site_url: https://yourname.github.io

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
      - Partner Vision: projects/partner-vision.md
  - Resume: resume.md
  - Contact: contact.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
